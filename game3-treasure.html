<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>津门寻宝图 · 艺术版</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold-1: #FFD700;
  --gold-2: #FFA500;
  --gold-3: #DAA520;
  --gold-dim: rgba(255, 215, 0, 0.35);
  --ink-black: #050510;
  --night-blue: #0d1b3d;
  --food-color: #FF8C00;
  --culture-color: #BA55D3;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--ink-black);
  color: #fff;
  font-family: 'Noto Serif SC', serif;
  overflow-x: hidden;
}

/* ========== Particle Canvas ========== */
canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }

/* ========== Nav ========== */
.top-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 5%;
  background: rgba(5, 5, 16, 0.7);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255, 215, 0, 0.08);
  transition: padding 0.4s;
}
.top-nav.compact { padding: 12px 5%; }
.nav-logo {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 26px;
  background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 4px;
  text-decoration: none;
}
.nav-progress {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 14px;
  color: var(--gold-1);
  letter-spacing: 3px;
  padding: 4px 18px;
  border: 1px solid rgba(255, 215, 0, 0.2);
  border-radius: 20px;
  background: rgba(255, 215, 0, 0.05);
}
.back-link {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 14px;
  color: var(--gold-dim);
  text-decoration: none;
  letter-spacing: 2px;
  transition: color 0.3s;
}
.back-link:hover { color: var(--gold-1); }

/* ========== Hero ========== */
.hero {
  position: relative;
  height: 100vh;
  min-height: 600px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.hero-sky {
  position: absolute; inset: 0;
  background: url('assets/map-art-sky.png') center / cover no-repeat;
  transform: scale(1.1);
  will-change: transform;
}
.hero-overlay {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 0%, rgba(5,5,16,0.4) 60%, rgba(5,5,16,0.9) 100%);
}
.hero-content {
  position: relative; z-index: 2;
  text-align: center;
}
.hero-title {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: clamp(60px, 12vw, 160px);
  background: linear-gradient(135deg, var(--gold-1) 20%, var(--gold-2) 50%, var(--gold-3) 80%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 30px;
  line-height: 1;
  text-shadow: 0 0 80px rgba(255, 215, 0, 0.3);
  opacity: 0;
  transform: translateY(60px);
  animation: heroIn 1.4s cubic-bezier(0.23, 1, 0.32, 1) 0.3s forwards;
}
.hero-subtitle {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 16px;
  color: rgba(255, 215, 0, 0.5);
  letter-spacing: 10px;
  margin-top: 20px;
  opacity: 0;
  animation: heroIn 1.2s ease 0.8s forwards;
}
.hero-line {
  width: 1px; height: 60px;
  background: linear-gradient(to bottom, transparent, var(--gold-dim), transparent);
  margin: 30px auto 0;
  opacity: 0;
  animation: heroIn 1s ease 1.2s forwards;
}
.hero-scroll-hint {
  position: absolute; bottom: 40px; left: 50%;
  transform: translateX(-50%);
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 12px;
  color: rgba(255, 215, 0, 0.3);
  letter-spacing: 4px;
  opacity: 0;
  animation: heroIn 1s ease 1.5s forwards, bob 2s ease-in-out 2.5s infinite;
}
@keyframes heroIn { to { opacity: 1; transform: translateY(0); } }
@keyframes bob { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(8px); } }

/* ========== Progress Section ========== */
.progress-section {
  position: relative; z-index: 2;
  padding: 40px 20px 20px;
  text-align: center;
}
.progress-bar-wrap {
  max-width: 600px; margin: 0 auto 20px;
  height: 6px;
  background: rgba(255, 215, 0, 0.08);
  border-radius: 3px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-3), var(--gold-1), var(--gold-2));
  border-radius: 3px;
  width: 0%;
  transition: width 0.6s cubic-bezier(0.23, 1, 0.32, 1);
  box-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
}
.progress-text {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 14px;
  color: var(--gold-dim);
  letter-spacing: 4px;
}
.legend {
  display: flex; justify-content: center; gap: 30px;
  margin-top: 16px;
  flex-wrap: wrap;
}
.legend-item {
  display: flex; align-items: center; gap: 8px;
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 12px;
  letter-spacing: 2px;
}
.legend-dot {
  width: 10px; height: 10px; border-radius: 50%;
}
.legend-dot.scenic { background: var(--gold-1); box-shadow: 0 0 8px var(--gold-1); }
.legend-dot.food { background: var(--food-color); box-shadow: 0 0 8px var(--food-color); }
.legend-dot.culture { background: var(--culture-color); box-shadow: 0 0 8px var(--culture-color); }

/* ========== Art Map ========== */
.map-container {
  position: relative;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
}
.map-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 11;
  border-radius: 16px;
  overflow: hidden;
  background: var(--ink-black);
  box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6), inset 0 0 100px rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 215, 0, 0.1);
  cursor: crosshair;
}

/* Parallax layers */
.map-layer {
  position: absolute; inset: -5%;
  pointer-events: none;
  will-change: transform;
  transition: transform 0.15s ease-out;
}
.map-layer-base {
  background: url('assets/map-art-base.png') center / cover no-repeat;
  z-index: 1;
}
.map-layer-river {
  background: url('assets/map-art-river.png') center / cover no-repeat;
  z-index: 2;
  opacity: 0.8;
}
.map-layer-buildings {
  background: url('assets/map-art-buildings.png') center / cover no-repeat;
  z-index: 3;
  opacity: 0.7;
}
.map-layer-overlay {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 40%, transparent 30%, rgba(5,5,16,0.5) 100%);
  z-index: 4;
  pointer-events: none;
}

/* District labels */
.district-label {
  position: absolute;
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 16px;
  color: rgba(255, 215, 0, 0.25);
  letter-spacing: 6px;
  z-index: 5;
  pointer-events: none;
  text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
}

/* Treasure markers */
.markers-layer {
  position: absolute; inset: 0;
  z-index: 10;
}
.marker {
  position: absolute;
  width: 44px; height: 44px;
  transform: translate(-50%, -50%);
  cursor: pointer;
  z-index: 10;
}
.marker-pulse {
  position: absolute; inset: -8px;
  border-radius: 50%;
  border: 2px solid;
  animation: pulse 2s ease-out infinite;
  pointer-events: none;
}
.marker.scenic .marker-pulse { border-color: var(--gold-1); }
.marker.food .marker-pulse { border-color: var(--food-color); }
.marker.culture .marker-pulse { border-color: var(--culture-color); }
@keyframes pulse {
  0% { transform: scale(0.8); opacity: 1; }
  100% { transform: scale(2); opacity: 0; }
}
.marker-core {
  width: 100%; height: 100%;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid;
  transition: all 0.3s;
  position: relative;
}
.marker.scenic .marker-core { border-color: var(--gold-1); box-shadow: 0 0 12px rgba(255,215,0,0.5); }
.marker.food .marker-core { border-color: var(--food-color); box-shadow: 0 0 12px rgba(255,140,0,0.5); }
.marker.culture .marker-core { border-color: var(--culture-color); box-shadow: 0 0 12px rgba(186,85,211,0.5); }
.marker-icon {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}
.marker:hover .marker-core { transform: scale(1.3); }
.marker.scenic:hover .marker-core { box-shadow: 0 0 26px rgba(255,215,0,0.9); }
.marker.food:hover .marker-core { box-shadow: 0 0 26px rgba(255,140,0,0.9); }
.marker.culture:hover .marker-core { box-shadow: 0 0 26px rgba(186,85,211,0.9); }
.marker-label {
  position: absolute;
  bottom: -28px; left: 50%;
  transform: translateX(-50%);
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 11px;
  color: var(--gold-1);
  letter-spacing: 2px;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.3s;
  text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
  pointer-events: none;
}
.marker:hover .marker-label { opacity: 1; }
.marker-check {
  position: absolute;
  top: -4px; right: -4px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--gold-1);
  color: var(--ink-black);
  font-size: 11px;
  font-weight: bold;
  display: none;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 8px var(--gold-1);
}
.marker.collected .marker-check { display: flex; }
.marker.collected .marker-pulse { animation: none; opacity: 0; }
.marker.collected .marker-core { opacity: 0.5; }

/* Floating marker animation */
.marker {
  animation: float 3s ease-in-out infinite;
}
.marker:nth-child(odd) { animation-delay: 0.5s; }
.marker:nth-child(3n) { animation-delay: 1s; }
@keyframes float {
  0%, 100% { transform: translate(-50%, -50%); }
  50% { transform: translate(-50%, -55%); }
}

/* ========== Popup ========== */
.popup-overlay {
  position: fixed; inset: 0;
  z-index: 200;
  background: rgba(5, 5, 16, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
}
.popup-overlay.active { opacity: 1; pointer-events: auto; }
.popup-card {
  width: 90%; max-width: 460px;
  background: linear-gradient(180deg, rgba(13, 27, 61, 0.95), rgba(5, 5, 16, 0.98));
  border: 1px solid rgba(255, 215, 0, 0.2);
  border-radius: 16px;
  overflow: hidden;
  transform: scale(0.9) translateY(20px);
  transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}
.popup-overlay.active .popup-card { transform: scale(1) translateY(0); }
.popup-img-wrap {
  width: 100%; height: 280px;
  overflow: hidden;
  position: relative;
}
.popup-img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.popup-img-wrap::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgba(5, 5, 16, 0.9) 100%);
}
.popup-close {
  position: absolute;
  top: 12px; right: 12px;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(5, 5, 16, 0.7);
  border: 1px solid rgba(255, 215, 0, 0.2);
  color: var(--gold-1);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  z-index: 5;
}
.popup-close:hover { background: rgba(255, 215, 0, 0.15); transform: rotate(90deg); }
.popup-body {
  padding: 24px 28px 28px;
}
.popup-type {
  display: inline-block;
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 11px;
  letter-spacing: 3px;
  padding: 2px 12px;
  border-radius: 10px;
  margin-bottom: 10px;
}
.popup-type.scenic { color: var(--gold-1); border: 1px solid rgba(255,215,0,0.3); }
.popup-type.food { color: var(--food-color); border: 1px solid rgba(255,140,0,0.3); }
.popup-type.culture { color: var(--culture-color); border: 1px solid rgba(186,85,211,0.3); }
.popup-name {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 28px;
  color: var(--gold-1);
  letter-spacing: 4px;
  margin-bottom: 4px;
}
.popup-district {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 12px;
  color: rgba(255, 255, 255, 0.4);
  letter-spacing: 2px;
  margin-bottom: 16px;
}
.popup-divider {
  width: 40px; height: 2px;
  background: linear-gradient(90deg, var(--gold-1), transparent);
  margin-bottom: 16px;
}
.popup-desc {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  line-height: 2;
  color: rgba(255, 255, 255, 0.65);
  margin-bottom: 20px;
}
.popup-tags {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-bottom: 24px;
}
.popup-tag {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 11px;
  color: rgba(255, 215, 0, 0.5);
  padding: 3px 10px;
  border: 1px solid rgba(255, 215, 0, 0.15);
  border-radius: 10px;
  letter-spacing: 1px;
}
.popup-collect-btn {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, var(--gold-3), var(--gold-1));
  border: none;
  border-radius: 8px;
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 15px;
  color: var(--ink-black);
  letter-spacing: 4px;
  cursor: pointer;
  transition: all 0.3s;
}
.popup-collect-btn:hover {
  box-shadow: 0 8px 24px rgba(255, 215, 0, 0.4);
  transform: translateY(-2px);
}
.popup-collect-btn.collected {
  background: rgba(255, 215, 0, 0.1);
  color: var(--gold-dim);
  cursor: default;
  border: 1px solid rgba(255, 215, 0, 0.15);
}

/* ========== Achievement ========== */
.achievement-overlay {
  position: fixed; inset: 0;
  z-index: 300;
  background: rgba(5, 5, 16, 0.95);
  backdrop-filter: blur(16px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s;
}
.achievement-overlay.active { opacity: 1; pointer-events: auto; }
.achievement-seal {
  width: 160px; height: 160px;
  border-radius: 50%;
  border: 3px solid var(--gold-1);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 30px;
  position: relative;
  animation: sealRotate 8s linear infinite;
  box-shadow: 0 0 60px rgba(255, 215, 0, 0.4);
}
.achievement-seal::before {
  content: '';
  position: absolute; inset: -10px;
  border-radius: 50%;
  border: 1px dashed rgba(255, 215, 0, 0.3);
  animation: sealRotate 12s linear infinite reverse;
}
@keyframes sealRotate {
  to { transform: rotate(360deg); }
}
.achievement-seal-char {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 64px;
  color: var(--gold-1);
  animation: sealRotate 8s linear infinite reverse;
}
.achievement-title {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 48px;
  color: var(--gold-1);
  letter-spacing: 12px;
  margin-bottom: 12px;
  text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
}
.achievement-subtitle {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 14px;
  color: rgba(255, 215, 0, 0.4);
  letter-spacing: 6px;
  margin-bottom: 36px;
}
.achievement-close {
  padding: 12px 40px;
  border: 1px solid rgba(255, 215, 0, 0.3);
  background: transparent;
  color: var(--gold-1);
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 14px;
  letter-spacing: 4px;
  cursor: pointer;
  border-radius: 30px;
  transition: all 0.3s;
}
.achievement-close:hover {
  background: rgba(255, 215, 0, 0.1);
  border-color: var(--gold-1);
}

/* ========== Footer ========== */
.site-footer {
  text-align: center;
  padding: 60px 20px;
  background: var(--ink-black);
  border-top: 1px solid rgba(255, 215, 0, 0.05);
  position: relative; z-index: 2;
}
.footer-text {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 13px;
  color: rgba(255, 215, 0, 0.2);
  letter-spacing: 6px;
}

/* ========== Responsive ========== */
@media (max-width: 768px) {
  .hero-title { font-size: 60px; letter-spacing: 12px; }
  .map-frame { aspect-ratio: 4 / 5; }
  .marker { width: 32px; height: 32px; }
  .legend { gap: 16px; }
}
</style>
</head>
<body>
<canvas id="particleCanvas"></canvas>

<nav class="top-nav" id="topNav">
  <a href="index.html" class="nav-logo">津门游</a>
  <span class="nav-progress" id="navProgress">宝藏 0/12</span>
  <a href="journey.html" class="back-link">← 启程</a>
</nav>

<!-- Hero -->
<section class="hero">
  <div class="hero-sky" id="heroSky"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1 class="hero-title">津门寻宝</h1>
    <p class="hero-subtitle">十二宝藏 · 六城区 · 尽收囊中</p>
    <div class="hero-line"></div>
  </div>
  <div class="hero-scroll-hint">向下滚动探索</div>
</section>

<!-- Progress -->
<section class="progress-section">
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar"></div>
  </div>
  <p class="progress-text" id="progressText">已收集 0 / 12</p>
  <div class="legend">
    <div class="legend-item"><span class="legend-dot scenic"></span>景点</div>
    <div class="legend-item"><span class="legend-dot food"></span>美食</div>
    <div class="legend-item"><span class="legend-dot culture"></span>人文</div>
  </div>
</section>

<!-- Art Map -->
<div class="map-container">
  <div class="map-frame" id="mapFrame">
    <!-- Parallax layers -->
    <div class="map-layer map-layer-base" id="layerBase"></div>
    <div class="map-layer map-layer-river" id="layerRiver"></div>
    <div class="map-layer map-layer-buildings" id="layerBuildings"></div>
    <div class="map-layer-overlay"></div>

    <!-- District labels -->
    <div class="district-label" style="top: 22%; left: 20%;">红桥</div>
    <div class="district-label" style="top: 22%; left: 60%;">河北</div>
    <div class="district-label" style="top: 55%; left: 15%;">南开</div>
    <div class="district-label" style="top: 50%; left: 48%;">和平</div>
    <div class="district-label" style="top: 75%; left: 55%;">河东</div>
    <div class="district-label" style="top: 78%; left: 40%;">河西</div>

    <!-- Markers -->
    <div class="markers-layer" id="markersLayer"></div>
  </div>
</div>

<!-- Popup -->
<div class="popup-overlay" id="popupOverlay">
  <div class="popup-card">
    <div class="popup-img-wrap">
      <img class="popup-img" id="popupImg" src="" alt="">
      <button class="popup-close" id="popupClose">✕</button>
    </div>
    <div class="popup-body">
      <span class="popup-type" id="popupType"></span>
      <h3 class="popup-name" id="popupName"></h3>
      <p class="popup-district" id="popupDistrict"></p>
      <div class="popup-divider"></div>
      <p class="popup-desc" id="popupDesc"></p>
      <div class="popup-tags" id="popupTags"></div>
      <button class="popup-collect-btn" id="popupCollect">收入囊中</button>
    </div>
  </div>
</div>

<!-- Achievement -->
<div class="achievement-overlay" id="achievementOverlay">
  <div class="achievement-seal">
    <span class="achievement-seal-char">通</span>
  </div>
  <h2 class="achievement-title">津门百晓生</h2>
  <p class="achievement-subtitle">十二宝藏 · 尽收囊中 · 津门通达</p>
  <button class="achievement-close" id="achievementClose">继续赏玩</button>
</div>

<footer class="site-footer">
  <p class="footer-text">津 门 游 · 沉 浸 式 天 津 文 化 之 旅</p>
</footer>

<script>
// ========== Treasure Data ==========
const treasures = [
  { id: 'wudadao', name: '五大道', type: 'scenic', district: '和平区', x: 48, y: 55,
    img: 'assets/treasure-wudadao.png',
    desc: '五大道是天津最具异国风情的街区，拥有英、法、意、德、西班牙等国风格的建筑230余幢，被誉为"万国建筑博览会"。漫步其中，仿佛穿越至上世纪二十年代的租界岁月，每一栋小楼都藏着一段近代史的往事。',
    tags: ['万国建筑', '近代史', '名人故居'] },

    tags: ['亚洲唯一', '梁启超故居', '地中海建筑'] },
  { id: 'jianbing', name: '煎饼果子', type: 'food', district: '河北区', x: 58, y: 42,
    img: 'assets/treasure-jianbing.png',
    desc: '煎饼果子是天津人的灵魂早餐。绿豆面糊在热铁板上摊成薄饼，磕入鸡蛋，撒上葱花，裹入薄脆（馃篦儿），刷上甜面酱和腐乳，对折即成。天津人对煎饼果子有执念：必须用绿豆面，必须裹薄脆，绝不放生菜和火腿。',
    tags: ['灵魂早餐', '绿豆面', '薄脆'] },
  { id: 'guhuajie', name: '古文化街', type: 'scenic', district: '南开区', x: 20, y: 62,

    tags: ['津门故里', '天后宫', '泥人张'] },
  { id: 'yangliuqing', name: '杨柳青年画', type: 'culture', district: '南开区', x: 15, y: 72,

    tags: ['中国四大年画', '国家级非遗', '木版彩绘'] },
  { id: 'guobacai', name: '锅巴菜', type: 'food', district: '南开区', x: 24, y: 70,
    img: 'assets/treasure-guobacai.png',
    desc: '锅巴菜是天津独有的特色早点，天津人亲切地叫它"嘎巴菜"。将绿豆煎饼切成细条，浇上醇厚的卤汁，撒上香菜、腐乳、麻酱和辣椒油。入口滑嫩鲜香，是天津人清晨最熟悉的味道，外地难以复刻。',
    tags: ['天津独有', '绿豆煎饼', '特色早点'] },
  { id: 'dabeisi', name: '大悲禅院', type: 'scenic', district: '红桥区', x: 25, y: 30,
    img: 'assets/treasure-dabeisi.png',
    desc: '大悲禅院是天津最大的佛教寺院，始建于清顺治年间。因供奉大慈大悲观世音菩萨而得名。弘一法师（李叔同）晚年曾在此弘法，寺内设有弘一法师纪念堂。殿宇巍峨、梵音悠远，是闹市中难得的清净之地。',
    tags: ['天津最大佛寺', '弘一法师', '清代古刹'] },
  { id: 'erduoyan', name: '耳朵眼炸糕', type: 'food', district: '红桥区', x: 30, y: 40,
    img: 'assets/treasure-erduoyan.png',
    desc: '耳朵眼炸糕是"天津三绝"之一，始于清光绪年间。因创始人刘万春的炸糕铺紧靠仅一米宽的"耳朵眼胡同"而得名。糯米外皮金黄酥脆，内馅红豆沙细腻甜美，现炸现卖，咬一口外酥里糯，满口生香。',
    tags: ['天津三绝', '糯米豆沙', '百年老字号'] },
  { id: 'tianta', name: '天塔', type: 'scenic', district: '河西区', x: 48, y: 82,
    img: 'assets/treasure-tianta.png',

    tags: ['津门十景', '415米', '旋转餐厅'] },
  { id: 'xiangsheng', name: '相声茶馆', type: 'culture', district: '河西区', x: 55, y: 88,
    img: 'assets/treasure-xiangsheng.png',
    desc: '天津是中国相声的"码头"，马三立、侯宝林、郭德纲等相声大师皆从天津走向全国。天津的相声茶馆保持着最传统的表演形式：一桌一扇一抚尺，说学逗唱，包袱不断。在茶馆嗑瓜子听相声，是天津人最惬意的夜生活。',
    tags: ['相声码头', '马三立', '非遗'] },
];

// ========== State ==========
let collected = new Set();
try {
  const saved = localStorage.getItem('jinmenyou_treasure_collected');
  if (saved) collected = new Set(JSON.parse(saved));
} catch(e) {}

// ========== Particle Background ==========
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
for (let i = 0; i < 50; i++) {
  particles.push({
    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
    r: Math.random() * 1.2 + 0.3,
    vx: (Math.random() - 0.5) * 0.2, vy: (Math.random() - 0.5) * 0.2,
    a: Math.random() * 0.4 + 0.05,
    c: Math.random() > 0.5 ? '255,215,0' : '255,255,255'
  });
}
function tick() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
    if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.c},${p.a})`;
    ctx.fill();
  });
  requestAnimationFrame(tick);
}
tick();

// ========== Hero Parallax ==========
const heroSky = document.getElementById('heroSky');
window.addEventListener('scroll', () => {
  const scrolled = window.pageYOffset;
  if (scrolled < window.innerHeight) {
    heroSky.style.transform = `scale(1.1) translateY(${scrolled * 0.4}px)`;
  }
  // Nav compact
  const nav = document.getElementById('topNav');
  if (scrolled > 60) nav.classList.add('compact');
  else nav.classList.remove('compact');
});

// ========== 2.5D Parallax Map ==========
const mapFrame = document.getElementById('mapFrame');
const layerBase = document.getElementById('layerBase');
const layerRiver = document.getElementById('layerRiver');
const layerBuildings = document.getElementById('layerBuildings');

mapFrame.addEventListener('mousemove', (e) => {
  const rect = mapFrame.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width - 0.5;
  const my = (e.clientY - rect.top) / rect.height - 0.5;

  // Different layers move at different rates (parallax depth)
  layerBase.style.transform = `translate(${mx * 8}px, ${my * 8}px) scale(1.02)`;
  layerRiver.style.transform = `translate(${mx * 16}px, ${my * 16}px) scale(1.04)`;
  layerBuildings.style.transform = `translate(${mx * 28}px, ${my * 28}px) scale(1.06)`;
});

mapFrame.addEventListener('mouseleave', () => {
  layerBase.style.transform = '';
  layerRiver.style.transform = '';
  layerBuildings.style.transform = '';
});

// ========== Render Markers ==========
const markersLayer = document.getElementById('markersLayer');

function renderMarkers() {
  markersLayer.innerHTML = '';
  treasures.forEach(t => {
    const m = document.createElement('div');
    m.className = `marker ${t.type}`;
    if (collected.has(t.id)) m.classList.add('collected');
    m.style.left = t.x + '%';
    m.style.top = t.y + '%';
    m.innerHTML = `
      <div class="marker-pulse"></div>
      <div class="marker-core">
        <img class="marker-icon" src="${t.img}" alt="${t.name}" loading="lazy">
        <span class="marker-check">✓</span>
      </div>
      <div class="marker-label">${t.name}</div>
    `;
    m.addEventListener('click', () => openPopup(t));
    markersLayer.appendChild(m);
  });
}
renderMarkers();

// ========== Popup ==========
const popupOverlay = document.getElementById('popupOverlay');
const popupImg = document.getElementById('popupImg');
const popupType = document.getElementById('popupType');
const popupName = document.getElementById('popupName');
const popupDistrict = document.getElementById('popupDistrict');
const popupDesc = document.getElementById('popupDesc');
const popupTags = document.getElementById('popupTags');
const popupCollect = document.getElementById('popupCollect');
let currentTreasure = null;

const typeLabels = { scenic: '景点', food: '美食', culture: '人文' };

function openPopup(t) {
  currentTreasure = t;
  popupImg.src = t.img;
  popupImg.alt = t.name;
  popupType.textContent = typeLabels[t.type];
  popupType.className = 'popup-type ' + t.type;
  popupName.textContent = t.name;
  popupDistrict.textContent = t.district;
  popupDesc.textContent = t.desc;
  popupTags.innerHTML = t.tags.map(tag => `<span class="popup-tag">${tag}</span>`).join('');

  if (collected.has(t.id)) {
    popupCollect.textContent = '✓ 已收集';
    popupCollect.classList.add('collected');
  } else {
    popupCollect.textContent = '收入囊中';
    popupCollect.classList.remove('collected');
  }

  popupOverlay.classList.add('active');
}

function closePopup() {
  popupOverlay.classList.remove('active');
}

document.getElementById('popupClose').addEventListener('click', closePopup);
popupOverlay.addEventListener('click', (e) => {
  if (e.target === popupOverlay) closePopup();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closePopup();
});

popupCollect.addEventListener('click', () => {
  if (!currentTreasure || collected.has(currentTreasure.id)) return;
  collected.add(currentTreasure.id);
  localStorage.setItem('jinmenyou_treasure_collected', JSON.stringify([...collected]));
  renderMarkers();
  updateProgress();
  popupCollect.textContent = '✓ 已收集';
  popupCollect.classList.add('collected');
  // Check achievement
  if (collected.size === treasures.length) {
    setTimeout(() => {
      closePopup();
      document.getElementById('achievementOverlay').classList.add('active');
      try {
        var s = JSON.parse(localStorage.getItem('jinmenyou_game_completed') || '{}');
        s.game3 = true;
        localStorage.setItem('jinmenyou_game_completed', JSON.stringify(s));
      } catch(e) {}
    }, 800);
  }
});

// ========== Progress ==========
function updateProgress() {
  const count = collected.size;
  const total = treasures.length;
  const percent = (count / total) * 100;
  document.getElementById('progressBar').style.width = percent + '%';
  document.getElementById('progressText').textContent = `已收集 ${count} / ${total}`;
  document.getElementById('navProgress').textContent = `宝藏 ${count}/${total}`;
}
updateProgress();

// ========== Achievement ==========
document.getElementById('achievementClose').addEventListener('click', () => {
  document.getElementById('achievementOverlay').classList.remove('active');
});
</script>
