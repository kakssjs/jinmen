<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>津门史话 · 天津历史文化之旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold-light: #FFF8DC;
    --gold-1: #FFD700;
    --gold-2: #DAA520;
    --gold-3: #B8860B;
    --gold-glow: rgba(255, 215, 0, 0.5);
    --ink: #050510;
    --night: #0a0a1a;
    --paper: #f0e6d0;
    --paper-dark: #e0d4b8;
    --ink-color: #2c1810;
    --ink-light: #5c4033;
    --leather: #3d2817;
    --leather-light: #5c3d24;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100vh;
    font-family: 'Noto Serif SC', serif;
    background: var(--ink);
    color: #fff;
    overflow: hidden;
  }

  /* ==================== 自定义光标 ==================== */
  @media (hover: hover) and (pointer: fine) {
    body { cursor: none; }
    .cursor {
      position: fixed;
      width: 22px; height: 22px;
      border: 1.5px solid var(--gold-1);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transition: width 0.25s, height 0.25s, background 0.25s;
      mix-blend-mode: screen;
      box-shadow: 0 0 18px var(--gold-glow);
    }
    .cursor::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 4px; height: 4px;
      background: var(--gold-1);
      border-radius: 50%;
    }
    .cursor.hover {
      width: 44px; height: 44px;
      background: rgba(255, 215, 0, 0.06);
      border-color: var(--gold-light);
    }
  }

  /* ==================== 背景 ==================== */
  .ambient-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(13, 27, 61, 0.4) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 60%, rgba(26, 10, 46, 0.3) 0%, transparent 50%),
      var(--ink);
    pointer-events: none;
  }

  .ambient-bg::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image:
      radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 80px 60px, rgba(255,215,0,0.4), transparent),
      radial-gradient(1.5px 1.5px at 140px 90px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 200px 120px, rgba(255,215,0,0.3), transparent);
    background-size: 250px 250px;
    animation: twinkle 5s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 0.4; }
  }

  #particleCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* ==================== 导航 ==================== */
  .back-btn {
    position: fixed;
    top: 26px; left: 36px;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 22px;
    background: rgba(5, 5, 16, 0.6);
    border: 1px solid rgba(255, 215, 0, 0.25);
    color: var(--gold-1);
    text-decoration: none;
    font-family: 'Noto Serif SC', serif;
    font-weight: 400;
    font-size: 13px;
    letter-spacing: 3px;
    transition: all 0.35s ease;
    backdrop-filter: blur(10px);
  }

  .back-btn:hover {
    background: rgba(255, 215, 0, 0.08);
    border-color: var(--gold-1);
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
    transform: translateX(-4px);
  }

  .back-btn .arrow { transition: transform 0.3s ease; }
  .back-btn:hover .arrow { transform: translateX(-3px); }

  .page-header {
    position: fixed;
    top: 26px; right: 36px;
    z-index: 1000;
    text-align: right;
  }

  .page-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 26px;
    background: linear-gradient(180deg, var(--gold-light), var(--gold-1), var(--gold-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 18px rgba(255, 215, 0, 0.3));
    letter-spacing: 6px;
  }

  .page-subtitle {
    font-family: 'Noto Serif SC', serif;
    font-weight: 300;
    font-size: 11px;
    color: rgba(255, 215, 0, 0.45);
    letter-spacing: 5px;
    margin-top: 4px;
  }

  /* ==================== 书本容器 ==================== */
  .book-stage {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 2200px;
  }

  .book {
    position: relative;
    width: 880px;
    height: 580px;
    transform-style: preserve-3d;
    transition: transform 1.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .book.closed { transform: rotateY(0deg) scale(1); }
  .book.open { transform: rotateY(0deg) scale(1); }

  /* 书脊 */
  .book-spine {
    position: absolute;
    left: 50%; top: 0;
    width: 36px; height: 100%;
    background: linear-gradient(90deg, #2a1a0e, #4a3420 50%, #2a1a0e);
    transform: translateX(-50%);
    z-index: 100;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
  }

  /* 封面 */
  .book-cover {
    position: absolute;
    width: 50%; height: 100%;
    top: 0;
    background:
      linear-gradient(135deg, #2d1a0a 0%, #4a3018 50%, #2d1a0a 100%);
    box-shadow: inset 0 0 80px rgba(0,0,0,0.5), 0 12px 50px rgba(0,0,0,0.6);
    transition: transform 1.6s cubic-bezier(0.16, 1, 0.3, 1);
    transform-style: preserve-3d;
    backface-visibility: hidden;
  }

  .book-cover.front {
    left: 50%;
    transform-origin: left center;
    z-index: 50;
  }

  .book-cover.back {
    left: 0;
    transform-origin: right center;
    z-index: 49;
  }

  .book.open .book-cover.front {
    transform: rotateY(-170deg);
  }

  /* 封面纹理 */
  .cover-texture {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background:
      url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.015' numOctaves='6' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.15 0 0 0 0 0.08 0 0 0 0 0.03 0 0 0 0.4 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.6;
    pointer-events: none;
  }

  .cover-border {
    position: absolute;
    top: 28px; left: 28px;
    right: 28px; bottom: 28px;
    border: 1px solid rgba(255, 215, 0, 0.3);
    pointer-events: none;
  }

  .cover-border::before {
    content: '';
    position: absolute;
    top: 6px; left: 6px;
    right: 6px; bottom: 6px;
    border: 1px solid rgba(255, 215, 0, 0.15);
  }

  .cover-corner {
    position: absolute;
    width: 28px; height: 28px;
    border-color: var(--gold-1);
    border-style: solid;
    border-width: 0;
  }

  .cover-corner.tl { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
  .cover-corner.tr { top: -2px; right: -2px; border-width: 2px 2px 0 0; }
  .cover-corner.bl { bottom: -2px; left: -2px; border-width: 0 0 2px 2px; }
  .cover-corner.br { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

  .cover-content {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 100%;
  }

  .cover-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 48px;
    background: linear-gradient(180deg, var(--gold-light), var(--gold-1), var(--gold-2), var(--gold-3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 18px rgba(255, 215, 0, 0.35));
    letter-spacing: 12px;
    margin-bottom: 20px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    display: inline-block;
  }

  .cover-subtitle {
    font-family: 'Noto Serif SC', serif;
    font-weight: 300;
    font-size: 13px;
    color: rgba(255, 215, 0, 0.5);
    letter-spacing: 6px;
    margin-top: 16px;
  }

  .open-hint {
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Noto Serif SC', serif;
    font-weight: 300;
    font-size: 12px;
    color: rgba(255, 215, 0, 0.45);
    letter-spacing: 4px;
    animation: pulseHint 2.5s ease-in-out infinite;
  }

  @keyframes pulseHint {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }

  /* ==================== 书页内容 ==================== */
  .book-pages {
    position: absolute;
    width: 50%; height: 100%;
    top: 0; left: 50%;
    background: var(--paper);
    background-image:
      url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='p'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.012' numOctaves='5' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.8 0 0 0 0 0.7 0 0 0 0 0.5 0 0 0 0.12 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23p)'/%3E%3C/svg%3E");
    overflow: hidden;
    box-shadow: inset 35px 0 35px -35px rgba(0,0,0,0.35);
  }

  .book-page {
    position: absolute;
    width: 100%; height: 100%;
    padding: 36px 32px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.5s ease, visibility 0.5s ease;
    overflow-y: auto;
  }

  .book-page.active { opacity: 1; visibility: visible; }

  .book-page::-webkit-scrollbar { width: 3px; }
  .book-page::-webkit-scrollbar-track { background: transparent; }
  .book-page::-webkit-scrollbar-thumb { background: rgba(139, 105, 20, 0.3); border-radius: 2px; }

  /* ==================== 目录页 ==================== */
  .toc-page {
    text-align: center;
    display: flex;
    flex-direction: column;
  }

  .toc-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 34px;
    color: var(--ink-color);
    letter-spacing: 10px;
    margin-bottom: 8px;
  }

  .toc-subtitle {
    font-family: 'Noto Serif SC', serif;
    font-weight: 300;
    font-size: 12px;
    color: var(--ink-light);
    letter-spacing: 5px;
    margin-bottom: 24px;
  }

  .toc-divider {
    width: 70px; height: 1px;
    margin: 0 auto 24px;
    background: linear-gradient(90deg, transparent, var(--gold-3), transparent);
  }

  .toc-list {
    list-style: none;
    padding: 0;
    flex: 1;
    overflow-y: auto;
  }

  .toc-list::-webkit-scrollbar { width: 3px; }
  .toc-list::-webkit-scrollbar-thumb { background: rgba(139, 105, 20, 0.25); border-radius: 2px; }

  .toc-item {
    padding: 12px 22px;
    margin-bottom: 4px;
    border-bottom: 1px dashed rgba(139, 105, 20, 0.2);
    transition: all 0.3s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: none;
  }

  .toc-item:hover {
    background: rgba(218, 165, 32, 0.08);
    transform: translateX(8px);
    border-bottom-color: var(--gold-3);
  }

  .toc-item-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .toc-number {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 18px;
    color: var(--gold-3);
    width: 28px;
  }

  .toc-item-title {
    font-family: 'Noto Serif SC', serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--ink-color);
    letter-spacing: 2px;
  }

  .toc-item-period {
    font-family: 'Noto Serif SC', serif;
    font-weight: 300;
    font-size: 10px;
    color: var(--ink-light);
    letter-spacing: 1px;
  }

  .toc-item-arrow {
    color: var(--gold-3);
    font-size: 13px;
    opacity: 0;
    transform: translateX(-8px);
    transition: all 0.3s ease;
  }

  .toc-item:hover .toc-item-arrow { opacity: 1; transform: translateX(0); }

  /* 语音开关 */
  .voice-control {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid rgba(139, 105, 20, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  .voice-control-label {
    font-family: 'Noto Serif SC', serif;
    font-weight: 400;
    font-size: 12px;
    color: var(--ink-light);
    letter-spacing: 2px;
  }

  .voice-toggle {
    position: relative;
    width: 46px; height: 24px;
    background: rgba(139, 105, 20, 0.15);
    border: 1px solid rgba(139, 105, 20, 0.3);
    border-radius: 12px;
    cursor: none;
    transition: all 0.3s ease;
  }

  .voice-toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    background: var(--gold-3);
    border-radius: 50%;
    transition: all 0.3s ease;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  }

  .voice-toggle.active {
    background: rgba(218, 165, 32, 0.35);
    border-color: var(--gold-2);
  }

  .voice-toggle.active::after {
    left: 24px;
    background: var(--gold-1);
    box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
  }

  .voice-status {
    font-family: 'Noto Serif SC', serif;
    font-weight: 400;
    font-size: 11px;
    color: var(--gold-3);
    min-width: 36px;
    text-align: left;
  }

  /* ==================== 场景页 ==================== */
  .scene-page { padding: 24px 28px; }

  .scene-page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .scene-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Noto Serif SC', serif;
    font-weight: 400;
    font-size: 12px;
    color: var(--ink-light);
    cursor: none;
    padding: 5px 12px;
    border: 1px solid rgba(139, 105, 20, 0.25);
    transition: all 0.3s ease;
  }

  .scene-back:hover {
    background: rgba(218, 165, 32, 0.1);
    border-color: var(--gold-3);
    color: var(--ink-color);
  }

  .scene-voice-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Noto Serif SC', serif;
    font-weight: 400;
    font-size: 11px;
    color: var(--gold-3);
    cursor: none;
    padding: 5px 12px;
    border: 1px solid rgba(218, 165, 32, 0.3);
    transition: all 0.3s ease;
    background: rgba(255, 215, 0, 0.03);
  }

  .scene-voice-btn:hover {
    background: rgba(255, 215, 0, 0.12);
    border-color: var(--gold-2);
  }

  .scene-voice-btn.playing {
    background: rgba(255, 165, 0, 0.15);
    border-color: var(--gold-1);
  }

  .scene-header { margin-bottom: 14px; }

  .scene-period-label {
    font-family: 'Noto Serif SC', serif;
    font-weight: 300;
    font-size: 11px;
    color: var(--gold-3);
    letter-spacing: 2px;
    margin-bottom: 5px;
  }

  .scene-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 28px;
    color: var(--ink-color);
    letter-spacing: 4px;
  }

  /* 场景图 */
  .scene-viewer {
    position: relative;
    width: 100%;
    height: 190px;
    overflow: hidden;
    margin-bottom: 14px;
    border: 1px solid rgba(139, 105, 20, 0.2);
    box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    cursor: none;
  }

  .scene-image {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 8s ease;
    filter: brightness(0.85) saturate(1.05);
  }

  .scene-viewer:hover .scene-image { transform: scale(1.08); }

  .scene-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(180deg, transparent 45%, rgba(44, 24, 16, 0.65) 100%);
    pointer-events: none;
  }

  /* 热点 */
  .hotspot {
    position: absolute;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--gold-1) 0%, var(--gold-2) 100%);
    border: 1.5px solid rgba(255, 248, 220, 0.7);
    cursor: none;
    z-index: 10;
    animation: hotspotPulse 2.5s ease-in-out infinite;
    box-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
  }

  .hotspot::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 5px; height: 5px;
    background: #fff;
    border-radius: 50%;
  }

  @keyframes hotspotPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 12px rgba(255, 215, 0, 0.5); }
    50% { transform: scale(1.25); box-shadow: 0 0 22px rgba(255, 215, 0, 0.8); }
  }

  .hotspot-label {
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(44, 24, 16, 0.92);
    color: var(--gold-1);
    padding: 3px 8px;
    font-size: 10px;
    font-family: 'Noto Serif SC', serif;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    letter-spacing: 1px;
  }

  .hotspot:hover .hotspot-label { opacity: 1; }

  /* 弹窗 */
  .hotspot-popup {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.92);
    width: 380px;
    background: var(--paper);
    border: 1px solid var(--gold-2);
    padding: 28px;
    z-index: 2000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.35s ease;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .hotspot-popup.show {
    opacity: 1; visibility: visible;
    transform: translate(-50%, -50%) scale(1);
  }

  .hotspot-popup h3 {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 22px;
    color: var(--ink-color);
    margin-bottom: 12px;
    letter-spacing: 2px;
  }

  .hotspot-popup p {
    font-family: 'Noto Serif SC', serif;
    font-weight: 400;
    font-size: 13px;
    color: var(--ink-light);
    line-height: 1.8;
    letter-spacing: 1px;
  }

  .hotspot-popup-close {
    position: absolute;
    top: 12px; right: 12px;
    width: 26px; height: 26px;
    border: 1px solid var(--gold-2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: none;
    color: var(--gold-3);
    font-size: 13px;
    transition: all 0.3s ease;
  }

  .hotspot-popup-close:hover { background: var(--gold-2); color: #fff; }

  .popup-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.55);
    z-index: 1999;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
  }

  .popup-overlay.show { opacity: 1; visibility: visible; }

  /* 文字介绍 */
  .scene-description {
    font-family: 'Noto Serif SC', serif;
    font-weight: 400;
    font-size: 13px;
    color: var(--ink-color);
    line-height: 2;
    letter-spacing: 1px;
    text-indent: 2em;
  }

  .scene-description p { margin-bottom: 8px; }

  /* 地理信息 */
  .geo-info {
    display: flex;
    gap: 12px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed rgba(139, 105, 20, 0.2);
  }

  .geo-item { flex: 1; text-align: center; }

  .geo-label {
    font-size: 10px;
    color: var(--ink-light);
    letter-spacing: 2px;
    margin-bottom: 3px;
    font-family: 'Noto Serif SC', serif;
    font-weight: 300;
  }

  .geo-value {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 14px;
    color: var(--gold-3);
  }

  /* 翻页 */
  .page-turn-hint {
    position: absolute;
    bottom: 14px; right: 22px;
    font-family: 'Noto Serif SC', serif;
    font-weight: 300;
    font-size: 10px;
    color: rgba(139, 105, 20, 0.4);
    letter-spacing: 2px;
    pointer-events: none;
  }

  .page-turn-hint-left {
    position: absolute;
    bottom: 14px; left: 22px;
    font-family: 'Noto Serif SC', serif;
    font-weight: 300;
    font-size: 10px;
    color: rgba(139, 105, 20, 0.4);
    letter-spacing: 2px;
    pointer-events: none;
  }

  .page-click-zone {
    position: absolute;
    top: 0;
    height: 100%;
    width: 50%;
    z-index: 5;
    cursor: none;
  }

  .page-click-zone.next { right: 0; }
  .page-click-zone.prev { left: 0; }

  .page-click-zone::after {
    content: '';
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 26px; height: 52px;
    background: var(--gold-2);
    opacity: 0;
    transition: opacity 0.3s ease;
    border-radius: 3px;
  }

  .page-click-zone:hover::after { opacity: 0.2; }

  .page-click-zone.next::after {
    right: 8px;
    clip-path: polygon(0 0, 100% 50%, 0 100%);
  }

  .page-click-zone.prev::after {
    left: 8px;
    clip-path: polygon(100% 0, 0 50%, 100% 100%);
  }

  /* 翻页动画 */
  .page-turn-enter { animation: pageTurnIn 0.6s ease forwards; }
  .page-turn-exit { animation: pageTurnOut 0.6s ease forwards; }

  @keyframes pageTurnIn {
    0% { opacity: 0; transform: translateX(50px) rotateY(-12deg); }
    100% { opacity: 1; transform: translateX(0) rotateY(0); }
  }

  @keyframes pageTurnOut {
    0% { opacity: 1; transform: translateX(0) rotateY(0); }
    100% { opacity: 0; transform: translateX(-50px) rotateY(12deg); }
  }

  /* 响应式 */
  @media (max-width: 1000px) {
    .book { width: 94vw; height: 78vh; }
    .cover-title { font-size: 36px; }
    .scene-viewer { height: 160px; }
  }
</style>

  // ==================== 语音播报 ====================
  let voiceEnabled = false;
  let currentUtterance = null;
  let isSpeaking = false;
  let currentSpeakingIndex = -1;
  const speechSupported = 'speechSynthesis' in window;

  function toggleVoice() {
    voiceEnabled = !voiceEnabled;
    const toggle = document.getElementById('voiceToggle');
    const status = document.getElementById('voiceStatus');
    if (voiceEnabled) {
      toggle.classList.add('active');
      status.textContent = '开启';
      status.style.color = 'var(--gold-1)';
      if (currentPage > 0 && isBookOpen) speakPeriod(currentPage - 1);
    } else {
      toggle.classList.remove('active');
      status.textContent = '关闭';
      status.style.color = '';
      stopSpeaking();
    }
  }

  function speakPeriod(index) {
    if (!voiceEnabled || !speechSupported) return;
    stopSpeaking();
    const period = historyPeriods[index];
    const fullText = period.title + '。' + period.period + '。' + period.description.join('');
    const utterance = new SpeechSynthesisUtterance(fullText);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.95;
    utterance.pitch = 1;
    utterance.volume = 1;
    const voices = window.speechSynthesis.getVoices();
    const zhVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('CN'));
    if (zhVoice) utterance.voice = zhVoice;
    utterance.onstart = () => { isSpeaking = true; currentSpeakingIndex = index; updateVoiceButtonState(true); };
    utterance.onend = () => {
      isSpeaking = false; updateVoiceButtonState(false);
      if (voiceEnabled && currentPage > 0 && currentPage < historyPeriods.length) {
        setTimeout(() => { if (voiceEnabled && currentPage > 0 && currentPage < historyPeriods.length) turnToNextPage(); }, 1500);
      }
    };
    utterance.onerror = () => { isSpeaking = false; updateVoiceButtonState(false); };
    currentUtterance = utterance;
    window.speechSynthesis.speak(utterance);
  }

  function stopSpeaking() {
    if (speechSupported && window.speechSynthesis.speaking) window.speechSynthesis.cancel();
    isSpeaking = false; currentSpeakingIndex = -1; currentUtterance = null;
    updateVoiceButtonState(false);
  }

  function updateVoiceButtonState(playing) {
    document.querySelectorAll('.scene-voice-btn').forEach(btn => {
      if (playing) { btn.classList.add('playing'); btn.innerHTML = '<span>▶</span> 播放中'; }
      else { btn.classList.remove('playing'); btn.innerHTML = '<span>♪</span> 语音朗读'; }
    });
  }

  if (speechSupported) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  let mx = 0, my = 0, cx = 0, cy = 0;
  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

  function animateCursor() {
    cx += (mx - cx) * 0.18; cy += (my - cy) * 0.18;
    cursor.style.left = cx - 11 + 'px'; cursor.style.top = cy - 11 + 'px';
    requestAnimationFrame(animateCursor);
  }
  animateCursor();

  function bindHover() {
    document.querySelectorAll('a, .toc-item, .scene-back, .hotspot, #bookCover, .hotspot-popup-close, .back-btn, .voice-toggle, .scene-voice-btn, .page-click-zone').forEach(el => {
      el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
      el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
    });

  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let mPos = { x: null, y: null };

  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  document.addEventListener('mousemove', e => { mPos.x = e.clientX; mPos.y = e.clientY; });

  class Particle {
    constructor() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.size = Math.random() * 1.2 + 0.3;
      this.speedX = (Math.random() - 0.5) * 0.2;
      this.speedY = (Math.random() - 0.5) * 0.2;
      this.opacity = Math.random() * 0.35 + 0.1;
      this.gold = Math.random() > 0.6;
    }
    update() {
      this.x += this.speedX; this.y += this.speedY;
      if (mPos.x !== null) {
        const dx = mPos.x - this.x, dy = mPos.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 110) { const f = (110 - dist) / 110; this.x -= dx * f * 0.01; this.y -= dy * f * 0.01; }
      }
      if (this.x < 0) this.x = canvas.width;
      if (this.x > canvas.width) this.x = 0;
      if (this.y < 0) this.y = canvas.height;
      if (this.y > canvas.height) this.y = 0;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      if (this.gold) {
        ctx.fillStyle = `rgba(255, 215, 0, ${this.opacity})`;
        ctx.shadowColor = 'rgba(255, 215, 0, 0.5)'; ctx.shadowBlur = 5;
      } else {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity * 0.35})`; ctx.shadowBlur = 0;
      }
      ctx.fill();
    }
  }

  function initParticles() {
    particles = [];
    const count = Math.min(70, Math.floor(canvas.width * canvas.height / 25000));
    for (let i = 0; i < count; i++) particles.push(new Particle());
  }
  initParticles();
  window.addEventListener('resize', initParticles);

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  // ==================== 书本交互 ====================
  const book = document.getElementById('book');
  const bookCover = document.getElementById('bookCover');
  const tocList = document.getElementById('tocList');
  const bookPages = document.querySelector('.book-pages');
  let isBookOpen = false;
  let currentPage = 0;

  function generateTOC() {
    historyPeriods.forEach((period, index) => {
      const li = document.createElement('li');
      li.className = 'toc-item';
      li.dataset.index = index;
      li.innerHTML = `
        <div class="toc-item-left">
          <span class="toc-number">${period.number}</span>
          <div><div class="toc-item-title">${period.title}</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
          <span class="toc-item-period">${period.period}</span>
          <span class="toc-item-arrow">→</span>
        </div>`;
      li.addEventListener('click', () => openScene(index));
      tocList.appendChild(li);
    });
  }

  function generateScenePages() {
    historyPeriods.forEach((period, index) => {
      const page = document.createElement('div');
      page.className = 'book-page scene-page';
      page.id = `scene-${index}`;
      page.innerHTML = `
        <div class="page-click-zone prev" data-action="prev"></div>
        <div class="page-click-zone next" data-action="next"></div>
        <div class="scene-page-header">
          <div class="scene-back" onclick="event.stopPropagation(); goToTOC();">← 返回目录</div>
          <div class="scene-voice-btn" onclick="event.stopPropagation(); toggleSceneVoice(${index});"><span>♪</span> 语音朗读</div>
        </div>
        <div class="scene-header">
          <div class="scene-period-label">${period.period} · ${period.years}</div>
          <h2 class="scene-title">${period.title}</h2>
        </div>
        <div class="scene-viewer" id="viewer-${index}">
          <img src="${period.image}" alt="${period.title}" class="scene-image">
          <div class="scene-overlay"></div>
          ${period.hotspots.map((hs, i) => `<div class="hotspot" style="left:${hs.x};top:${hs.y};" data-period="${index}" data-hotspot="${i}"><div class="hotspot-label">${hs.name}</div></div>`).join('')}
        </div>
        <div class="scene-description">${period.description.map(p => `<p>${p}</p>`).join('')}</div>
        <div class="geo-info">
          <div class="geo-item"><div class="geo-label">地理位置</div><div class="geo-value">${period.geo.location}</div></div>
          <div class="geo-item"><div class="geo-label">城市特征</div><div class="geo-value">${period.geo.feature}</div></div>
          <div class="geo-item"><div class="geo-label">城市地位</div><div class="geo-value">${period.geo.status}</div></div>
        </div>
        <div class="page-turn-hint-left">${index > 0 ? '← 上一页' : ''}</div>
        <div class="page-turn-hint">${index < historyPeriods.length - 1 ? '下一页 →' : ''}</div>`;
      bookPages.appendChild(page);
    });
    document.querySelectorAll('.hotspot').forEach(hs => {
      hs.addEventListener('click', e => {
        e.stopPropagation();
        showHotspotPopup(historyPeriods[parseInt(hs.dataset.period)].hotspots[parseInt(hs.dataset.hotspot)]);
      });
    });
    document.querySelectorAll('.page-click-zone').forEach(zone => {
      zone.addEventListener('click', e => {
        e.stopPropagation();
        if (zone.dataset.action === 'next') turnToNextPage();
        else turnToPrevPage();
      });
    });
  }

  bookCover.addEventListener('click', () => {
    if (!isBookOpen) {
      book.classList.add('open'); book.classList.remove('closed');
      isBookOpen = true;
      setTimeout(() => { if (voiceEnabled) speakTOCIntroduction(); }, 1800);
    }
  });

  function speakTOCIntroduction() {
    if (!voiceEnabled || !speechSupported) return;
    stopSpeaking();
    const intro = '欢迎来到津门史话。本书共收录天津六个重要历史时期，从隋唐三会海口，到当代渤海明珠，带您穿越六百年津门沧桑。请点击目录中的条目，开启历史之旅。';
    const utterance = new SpeechSynthesisUtterance(intro);
    utterance.lang = 'zh-CN'; utterance.rate = 0.95;
    utterance.onend = () => { isSpeaking = false; };
    currentUtterance = utterance; isSpeaking = true;
    window.speechSynthesis.speak(utterance);
  }

  function toggleSceneVoice(index) {
    if (isSpeaking && currentSpeakingIndex === index) stopSpeaking();
    else {
      voiceEnabled = true;
      document.getElementById('voiceToggle').classList.add('active');
      document.getElementById('voiceStatus').textContent = '开启';
      document.getElementById('voiceStatus').style.color = 'var(--gold-1)';
      speakPeriod(index);
    }
  }

  function openScene(index) {
    stopSpeaking();
    document.querySelectorAll('.book-page').forEach(p => {
      if (p.classList.contains('active')) {
        p.classList.add('page-turn-exit');
        setTimeout(() => p.classList.remove('active', 'page-turn-exit'), 500);
      }
    });
    setTimeout(() => {
      const newPage = document.getElementById(`scene-${index}`);
      newPage.classList.add('active', 'page-turn-enter');
      setTimeout(() => newPage.classList.remove('page-turn-enter'), 600);
      currentPage = index + 1;
      if (voiceEnabled) setTimeout(() => speakPeriod(index), 700);
    }, 300);
  }

  function goToTOC() {
    stopSpeaking();
    document.querySelectorAll('.book-page').forEach(p => {
      if (p.classList.contains('active')) {
        p.classList.add('page-turn-exit');
        setTimeout(() => p.classList.remove('active', 'page-turn-exit'), 500);
      }
    });
    setTimeout(() => {
      document.getElementById('tocPage').classList.add('active', 'page-turn-enter');
      setTimeout(() => document.getElementById('tocPage').classList.remove('page-turn-enter'), 600);
      currentPage = 0;
    }, 300);
  }

  function turnToNextPage() {
    if (currentPage === 0) openScene(0);
    else if (currentPage < historyPeriods.length) openScene(currentPage);
  }

  function turnToPrevPage() {
    if (currentPage > 1) openScene(currentPage - 2);
    else if (currentPage === 1) goToTOC();
  }

  // 弹窗
  const popupOverlay = document.getElementById('popupOverlay');
  const hotspotPopup = document.getElementById('hotspotPopup');
  const popupClose = document.getElementById('popupClose');

  function showHotspotPopup(hotspot) {
    document.getElementById('popupTitle').textContent = hotspot.name;
    document.getElementById('popupContent').textContent = hotspot.desc;
    popupOverlay.classList.add('show');
    hotspotPopup.classList.add('show');
  }

  function hideHotspotPopup() { popupOverlay.classList.remove('show'); hotspotPopup.classList.remove('show'); }
  popupOverlay.addEventListener('click', hideHotspotPopup);
  popupClose.addEventListener('click', hideHotspotPopup);

  // 语音开关
  document.getElementById('voiceToggle').addEventListener('click', toggleVoice);

  // 键盘
  document.addEventListener('keydown', e => {
    if (!isBookOpen) return;
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); turnToNextPage(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); turnToPrevPage(); }
    else if (e.key === 'Escape') {
      if (popupOverlay.classList.contains('show')) hideHotspotPopup();
      else if (currentPage > 0) goToTOC();
    }
  });

  // 初始化
  generateTOC();
  generateScenePages();
  bindHover();
</script>

</body>
</html>
